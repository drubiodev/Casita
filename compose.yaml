services:
  postgres:
    image: postgres:17-alpine
    container_name: casita-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: casita
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - casita-pgdata:/var/lib/postgresql/data
      - ./src/Casita.Infrastructure/SqlScripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d casita" ]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: casita-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@casita.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - casita-pgadmin:/var/lib/pgadmin

volumes:
  casita-pgdata:
  casita-pgadmin:
